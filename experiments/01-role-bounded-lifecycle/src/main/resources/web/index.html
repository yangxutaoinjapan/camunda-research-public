<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Role lifecycle</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#fff; --ink:#1c1c1c; --muted:#666; --line:#c4c4c4; --head:#f1f1f1; --accent:#17598a;
  --open:#1b6b3a; --drain:#8a5a00; --bad:#a31515; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17191c; --ink:#e4e4e4; --muted:#999; --line:#3a3d42; --head:#212428; --accent:#6fb3e0;
  --open:#6fcf97; --drain:#e0b04f; --bad:#f08a8a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1180px;margin:0 auto;padding:0 16px 56px}
.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;border-bottom:1px solid var(--line);padding:14px 0 10px;margin-bottom:6px}
.bar h1{font-size:17px;font-weight:600;margin:0}
h2{font-size:14px;font-weight:600;margin:22px 0 6px}
.mono,td.n,.t{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
[hidden]{display:none!important}
.s-open{color:var(--open)} .s-drain{color:var(--drain)} .s-bad{color:var(--bad)}

table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--head);font-weight:600;white-space:nowrap}
td.lane{min-width:120px}
td.lane .c{font-family:var(--mono);font-size:12px}
td .k{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.wrap{overflow-x:auto}
td.empty{color:var(--muted)}

/* one row per action: verb | object | parameters | button | result */
table.act th{width:104px}
table.act td{padding:6px 8px}
table.act .res{min-width:200px;width:34%}
table.sched .res{min-width:0;width:auto}
table.sched th{width:104px}
.fields{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.fields label{display:inline-flex;align-items:center;gap:5px}
select,input[type=text]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:3px 5px;min-height:26px}
select:invalid,select.unset{color:var(--muted)}
input[type=text]{width:150px}
button{font:inherit;color:inherit;background:var(--head);border:1px solid var(--line);border-radius:2px;padding:3px 12px;min-height:26px;cursor:pointer}
button.go{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.go{color:#0d1b26}}
button.stop{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.res .why{color:var(--muted)}
.res.working{color:var(--muted)} .res.done{color:var(--open)} .res.failed{color:var(--bad)}
.confirm button{margin-right:6px}

table.facts th{width:104px}
.sum{color:var(--muted);margin:6px 0 8px}
.pick{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.gap{color:var(--muted)}
table.log td:first-child{white-space:nowrap}
details{margin-top:22px}
summary{cursor:pointer;color:var(--muted)}
@media (max-width:760px){
  /* each action is a block: name, controls, then the answer under the button (the answer column ran off the right edge of a phone) */
  table.act,table.act tbody,table.act tr,table.act th,table.act td{display:block;width:auto}
  table.act tr{border-top:1px solid var(--line,#ccd)}
  table.act th{background:none;border:0;padding:8px 8px 0}
  table.act td{border:0}
  table.act .res{min-width:0;width:auto;padding-top:0}
  table.act .res:empty{display:none}
}
</style>
</head>
<body>
<main>
<div class="bar"><h1>Role lifecycle</h1><span id="engine" class="t muted">connecting</span></div>

<h2>Roles</h2>
<div class="wrap"><table id="roles" aria-label="Roles">
  <thead><tr><th>Role</th><th>State</th><th>Opened (UTC)</th><th>Closes / ended (UTC)</th><th>Lane a</th><th>Lane b</th><th>Lane c</th></tr></thead>
  <tbody id="rolesBody"><tr><td class="empty" colspan="7">Loading</td></tr></tbody>
</table></div>

<h2>Actions</h2>
<table class="act">
  <tr id="rowOpen">
    <th scope="row">Open role</th>
    <td><form id="open" class="fields" autocomplete="off">
      <label>Name <input id="openName" type="text" maxlength="40" spellcheck="false" placeholder="e.g. nov-batch" required pattern="[a-z0-9][a-z0-9\-]{0,39}"></label>
      <label>Closes after <select id="openN" required><option value="" class="ph">Choose</option></select>
        <select id="openUnit" required><option value="" class="ph">Choose</option><option value="1">minutes</option><option value="60">hours</option><option value="1440">days</option></select></label>
      <button class="go" type="submit" id="openGo">Open role</button></form></td>
    <td class="res" id="resOpen" aria-live="polite"></td>
  </tr>
  <tr id="rowSend">
    <th scope="row">Send events</th>
    <td><form id="send" class="fields">
      <label>Role <select id="sendRole" required></select></label>
      <label>Lane <select id="sendLane" required><option value="">Choose</option><option>a</option><option>b</option><option>c</option></select></label>
      <label>Count <select id="sendCount" required><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option><option>20</option></select></label>
      <label>Work time <select id="sendWork" required><option value="">Choose</option><option value="200">200 ms</option><option value="2000">2 s</option><option value="10000">10 s</option><option value="30000">30 s</option><option value="120000">2 min</option></select></label>
      <button class="go" type="submit" id="sendGo">Send events</button></form></td>
    <td class="res" id="resSend" aria-live="polite"></td>
  </tr>
  <tr id="rowCancel">
    <th scope="row">Cancel role</th>
    <td><form id="cancel" class="fields">
      <label>Role <select id="cancelRole" required></select></label>
      <button class="stop" type="submit" id="cancelGo">Cancel role</button></form></td>
    <td class="res" id="resCancel" aria-live="polite"></td>
  </tr>
</table>

<h2>Schedule</h2>
<form id="schedule">
<table class="act sched">
  <tr><th scope="row">Schedule</th><td colspan="2"><div class="fields"><select id="enabled" aria-label="Schedule on or off"><option value="off">Off: no roles open by themselves</option><option value="on">On: open roles by the rules below</option></select></div></td></tr>
  <tr><th scope="row">Opens</th><td colspan="2"><div class="pick">
    <select id="startMode" aria-label="How a role opens"><option value="month">Once a month</option><option value="interval">Every few minutes</option></select>
    <span id="startMonth" class="pick"><span class="gap">day</span><select id="startDay" aria-label="Day of month"></select><span class="gap">at</span><select id="startHour" aria-label="Hour"></select><span>:</span><select id="startMin" aria-label="Minute"></select><span class="gap">UTC</span></span>
    <span id="startInterval" class="pick" hidden><span class="gap">every</span><select id="startEvery" aria-label="Minutes between roles"></select><span class="gap">minutes</span></span></div></td></tr>
  <tr><th scope="row">Closes</th><td colspan="2"><div class="pick">
    <select id="closeMode" aria-label="How a role closes"><option value="next">At a time in the next period</option><option value="after">After a time</option></select>
    <span id="closeNext" class="pick"><span class="gap">day</span><select id="closeDay" aria-label="Day of month"></select><span class="gap">at</span><select id="closeHour" aria-label="Hour"></select><span>:</span><select id="closeMin" aria-label="Minute"></select><span class="gap">UTC</span></span>
    <span id="closeAfter" class="pick" hidden><select id="afterN" aria-label="Amount"></select><select id="afterUnit" aria-label="Unit"><option value="minute">minutes</option><option value="hour">hours</option><option value="day">days</option></select></span></div></td></tr>
  <tr><th scope="row">Summary</th><td colspan="2" class="muted" id="summary"></td></tr>
  <tr><th scope="row">Save</th><td class="res" id="resSchedule" aria-live="polite" colspan="2"><button class="go" type="submit" id="save">Save schedule</button> <span id="resScheduleText"></span></td></tr>
  <tr><th scope="row">Next</th><td colspan="2" class="t"><span id="nextOpen">-</span> &nbsp;opens &nbsp;|&nbsp; <span id="nextClose">-</span> &nbsp;closes</td></tr>
</table>
</form>

<h2>Log</h2>
<table class="log"><thead><tr><th>Time</th><th>What</th><th>Object</th><th>Result</th></tr></thead><tbody id="log"></tbody></table>

<details><summary>API token</summary>
  <p><label>Token <input id="token" type="password" autocomplete="off"></label> <button id="connect" type="button">Connect</button></p>
</details>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
let loaded=false,busy=false,lastRoles=[],lastSchedule=null,fastUntil=0,first=true;
const pending=[],seen=new Map(),own=new Set(),cancelling=new Map();

async function api(path,body){
  const headers={};
  if($('token').value)headers['X-Lab-Token']=$('token').value;
  if(body!==undefined)headers['Content-Type']='application/json';
  const r=await fetch('api/'+path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
  const data=await r.json();
  if(!r.ok)throw Error(data.error||'Request failed');
  return data;
}
const pad=n=>String(n).padStart(2,'0');
function utc(v){ if(!v)return '-'; const d=new Date(v); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds()); }
function clock(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function span(ms){ const s=Math.max(0,Math.round(ms/1000)); if(s<120)return s+' s'; const m=Math.floor(s/60); if(m<120)return m+' min '+pad(s%60)+' s'; const h=Math.floor(m/60); if(h<48)return h+' h '+(m%60)+' min'; return Math.floor(h/24)+' d '+(h%24)+' h'; }
function el(tag,attrs,...kids){ const e=document.createElement(tag); for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,v); for(const k of kids)e.append(k); return e; }
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const nice=k=>String(k||'').replace(/^role-manual-/,'manual ').replace(/^role-/,'');
const nameOf=r=>nice(r.roleKey||r.key);
const phase=r=>r.state!=='ACTIVE'?'closed':r.open?'open':'drain';
const sum=r=>['a','b','c'].reduce((t,l)=>({a:t.a+(r.lanes[l]?r.lanes[l].ACTIVE:0),d:t.d+(r.lanes[l]?r.lanes[l].COMPLETED:0)}),{a:0,d:0});
const active=()=>lastRoles.filter(r=>r.state==='ACTIVE'&&!cancelling.has(r.key));
const bySchedule=r=>!!(lastSchedule&&lastSchedule.config&&lastSchedule.config.enabled&&lastSchedule.currentRoleKey===r.roleKey);
const openRoles=()=>lastRoles.filter(r=>r.state==='ACTIVE'&&r.open);

function log(what,object,result,bad){
  const tr=el('tr',{},el('td',{class:'t'},clock()),el('td',{},what),el('td',{},object||''),el('td',{class:bad?'s-bad':''},result));
  const b=$('log');b.prepend(tr);while(b.children.length>25)b.lastChild.remove();
}
function result(id,kind,text){const c=$(id);c.className='res '+kind;c.textContent=text;}

/* ---- the roles table: running first, then the newest finished ones; ages tick every second */
function renderRoles(){
  const body=$('rolesBody');body.replaceChildren();const now=Date.now();
  const rows=[];
  for(const p of pending)rows.push({pending:p});
  for(const r of lastRoles)rows.push({r});
  if(!rows.length){body.append(el('tr',{},el('td',{class:'empty',colspan:'7'},'No roles yet.')));return;}
  for(const row of rows){
    if(row.pending){const p=row.pending;body.append(el('tr',{},el('td',{},nice(p.key)),el('td',{class:'muted'},'Opening'),el('td',{class:'t'},'-'),el('td',{class:'t'},'-'),el('td',{class:'muted',colspan:'3'},'Accepted by the engine, not visible yet')));continue;}
    const r=row.r,ph=phase(r),t=sum(r),start=Date.parse(r.start),closes=r.closes?Date.parse(r.closes):null;
    const state=r.state==='ACTIVE'&&cancelling.has(r.key)?'Cancelling':r.state==='ACTIVE'?(ph==='open'?'Open':'Draining'):r.state==='TERMINATED'?'Cancelled':r.state==='COMPLETED'?'Completed':r.state;
    const cls=state==='Cancelling'?'s-drain':ph==='open'?'s-open':ph==='drain'?'s-drain':r.state==='TERMINATED'?'s-bad':'muted';
    const closeCell=r.state==='ACTIVE'?el('td',{class:'t'},utc(r.closes),el('span',{class:'k muted'},ph==='open'?'in '+span(closes-now):'ended '+span(now-closes)+' ago')):el('td',{class:'t'},utc(r.end),el('span',{class:'k muted'},'lasted '+span(Date.parse(r.end)-start)));
    const tr=el('tr',{},
      el('td',{},nameOf(r)),
      el('td',{class:cls},state+(r.incident?', incident':'')+(ph==='drain'&&t.a?` (waiting for ${t.a})`:'')),
      el('td',{class:'t'},utc(r.start),r.state==='ACTIVE'?el('span',{class:'k muted'},span(now-start)+' ago'):''),
      closeCell);
    for(const l of ['a','b','c']){
      const c=r.lanes[l]||{ACTIVE:0,COMPLETED:0},run=(r.running&&r.running[l])||[];
      const td=el('td',{class:'lane'},el('span',{class:'c'},`${c.ACTIVE} running`),el('span',{class:'c k'},`${c.COMPLETED} done`));
      for(const ch of run.slice(0,5))td.append(el('span',{class:'k'},'child '+String(ch.key).slice(-5)+'  '+span(now-Date.parse(ch.start))));
      if(run.length>5)td.append(el('span',{class:'k'},'+'+(run.length-5)+' more'));
      tr.append(td);
    }
    body.append(tr);
  }
}

/* ---- every action names its object: selects start unset and the button waits for a choice */
function fillSelect(sel,items,placeholder){
  const sig=items.map(i=>i.value).join('|');
  if(sel.dataset.sig===sig)return;
  const was=sel.value;sel.dataset.sig=sig;sel.replaceChildren(el('option',{value:''},placeholder));
  for(const it of items)sel.append(el('option',{value:it.value},it.text));
  if(items.some(i=>i.value===was))sel.value=was;
}
function ready(form){return [...form.querySelectorAll('select[required],input[required]')].every(f=>f.value!==''&&f.checkValidity());}
function renderForms(){
  const opn=openRoles(),act=active();
  fillSelect($('sendRole'),opn.map(r=>({value:r.roleKey,text:nameOf(r)})),opn.length?'Choose a role':'No open role');
  fillSelect($('cancelRole'),act.map(r=>({value:r.key,text:nameOf(r)+(phase(r)==='drain'?' (draining)':'')})),act.length?'Choose a role':'Nothing running');
  const openBlocked=opn.length>0,ro=$('resOpen');
  $('openGo').disabled=openBlocked||!ready($('open'));
  if(openBlocked){if(ro.className==='res'||ro.className==='res why')result('resOpen','why',`${nameOf(opn[0])} is open. Only one role can be open at a time.`);}
  else if(ro.className==='res why')result('resOpen','','');
  $('sendGo').disabled=!ready($('send'));
  $('cancelGo').disabled=!ready($('cancel'));
}
for(const f of ['open','send','cancel'])$(f).addEventListener('input',renderForms);
for(let i=1;i<=60;i++)if([1,2,3,4,5,6,8,10,12,15,20,30,45,60].includes(i))$('openN').append(el('option',{value:String(i)},String(i)));

function detectChanges(){
  for(const r of lastRoles){
    const key=nameOf(r),p=phase(r),was=seen.get(r.key);
    if(!first&&was!==p){
      if(was===undefined&&p==='open')log('Role opened',key,'Open');
      else if(p==='drain')log('Role past its close time',key,'Draining');
      else if(p==='closed'&&!(r.state==='TERMINATED'&&own.has(r.key)))log(r.state==='TERMINATED'?'Role cancelled':'Role completed',key,r.state==='TERMINATED'?'Cancelled':'Completed');
    }
    seen.set(r.key,p);
  }
  for(let i=pending.length-1;i>=0;i--){
    if(lastRoles.some(r=>(r.roleKey||r.key)===pending[i].key))pending.splice(i,1);
    else if(Date.now()-pending[i].since>45000){log('Open role',nice(pending[i].key),'Accepted but not visible after 45 s. Check the engine.',true);pending.splice(i,1);}
  }
  // a cancelled role stays ACTIVE in the engine's search for a few seconds: the table says Cancelling until it is not
  for(const [k,since] of [...cancelling]){
    const r=lastRoles.find(x=>x.key===k);
    if(!r||r.state!=='ACTIVE')cancelling.delete(k);
    else if(Date.now()-since>60000){cancelling.delete(k);log('Cancel role',nice(r.roleKey||k),'Accepted but the engine still shows it running after 60 s. Check the engine.',true);}
  }
  first=false;
}
async function loadRoles(){
  try{const d=await api('roles');lastRoles=d.roles;}
  catch(e){$('rolesBody').replaceChildren(el('tr',{},el('td',{class:'s-bad',colspan:'7'},e.message)));return;}
  detectChanges();renderRoles();renderForms();
}

/* ---- schedule dropdowns */
const pad2d=n=>String(n).padStart(2,'0');
function fill(id,values){const e=$(id);e.replaceChildren();for(const v of values){const o=document.createElement('option');o.value=String(v);o.textContent=String(v);e.append(o);}}
function ensure(id,v){const e=$(id);if(![...e.options].some(o=>o.value===String(v))){const o=document.createElement('option');o.value=String(v);o.textContent=String(v);e.append(o);}e.value=String(v);}
const days=Array.from({length:28},(_,i)=>i+1),hours=Array.from({length:24},(_,i)=>pad2d(i)),mins=['00','05','10','15','20','30','40','45','50'];
for(const k of ['start','close']){fill(k+'Day',days);fill(k+'Hour',hours);fill(k+'Min',mins);}
fill('startEvery',[1,2,3,5,10,15,20,30,45,60,120,180,360,720,1440]);
fill('afterN',[1,2,3,4,5,6,8,10,12,15,20,30,45,60,90,120]);
function sync(){
  const month=$('startMode').value==='month';
  $('startMonth').hidden=!month;$('startInterval').hidden=month;
  const next=$('closeMode').querySelector('option[value=next]');
  next.disabled=!month;if(!month&&$('closeMode').value==='next')$('closeMode').value='after';
  $('closeNext').hidden=$('closeMode').value!=='next';$('closeAfter').hidden=$('closeMode').value!=='after';
  $('summary').textContent=describe();
}
function startRule(){return $('startMode').value==='month'?`day of month ${$('startDay').value} at ${$('startHour').value}:${$('startMin').value}`:`every ${$('startEvery').value} minutes`;}
function closeRule(){
  if($('closeMode').value==='next')return `at day of month ${$('closeDay').value} ${$('closeHour').value}:${$('closeMin').value} of the next period`;
  const n=$('afterN').value,u=$('afterUnit').value;return `after ${n} ${u}${n==='1'?'':'s'}`;
}
function describe(){
  const o=$('startMode').value==='month'?`Opens on day ${$('startDay').value} of each month at ${$('startHour').value}:${$('startMin').value} UTC`:`Opens every ${$('startEvery').value} minute${$('startEvery').value==='1'?'':'s'}`;
  const c=$('closeMode').value==='next'?`and closes on day ${$('closeDay').value} of the next month at ${$('closeHour').value}:${$('closeMin').value} UTC.`:`and closes ${$('afterN').value} ${$('afterUnit').value}${$('afterN').value==='1'?'':'s'} after it opens.`;
  return o+' '+c;
}
function setRules(cfg){
  let m=/^day of month (\d+) at (\d\d):(\d\d)$/.exec(cfg.start);
  if(m){$('startMode').value='month';ensure('startDay',+m[1]);ensure('startHour',m[2]);ensure('startMin',m[3]);}
  else if((m=/^every (\d+) minutes?$/.exec(cfg.start))){$('startMode').value='interval';ensure('startEvery',+m[1]);}
  if((m=/^at day of month (\d+) (\d\d):(\d\d) of the next period$/.exec(cfg.close))){$('closeMode').value='next';ensure('closeDay',+m[1]);ensure('closeHour',m[2]);ensure('closeMin',m[3]);}
  else if((m=/^after (\d+) (minute|hour|day)s?$/.exec(cfg.close))){$('closeMode').value='after';ensure('afterN',+m[1]);$('afterUnit').value=m[2];}
  sync();
}
for(const id of ['startMode','startDay','startHour','startMin','startEvery','closeMode','closeDay','closeHour','closeMin','afterN','afterUnit'])$(id).addEventListener('change',sync);
async function loadSchedule(){
  try{
    const s=await api('schedule');lastSchedule=s;
    if(!loaded){$('enabled').value=s.config.enabled?'on':'off';setRules(s.config);loaded=true;}
    $('nextOpen').textContent=s.config.enabled?utc(s.nextOpen):'schedule is off';
    $('nextClose').textContent=s.config.enabled?utc(s.nextClose):'-';
  }catch(e){$('nextOpen').textContent=e.message;}
}
async function loadClock(){
  try{const c=await api('clock');$('engine').textContent='engine online  '+utc(c.now)+' UTC';$('engine').className='t muted';}
  catch(e){$('engine').textContent='engine unavailable';$('engine').className='t s-bad';}
}
async function refresh(){if(busy)return;busy=true;await Promise.allSettled([loadRoles(),loadSchedule(),loadClock()]);busy=false;}
function loop(){refresh().finally(()=>setTimeout(loop,Date.now()<fastUntil?3000:15000));}

/* ---- actions: say what is happening, then what happened, in the row of the action and in the log */
async function run(resId,what,object,path,body,done,after){
  result(resId,'working','Working...');
  try{const d=await api(path,body);fastUntil=Date.now()+40000;const text=done(d);result(resId,'done',text);log(what,object,text);if(after)after(d);await refresh();}
  catch(e){result(resId,'failed',e.message);log(what,object,e.message,true);}
  finally{renderForms();}
}
$('open').addEventListener('submit',e=>{e.preventDefault();
  const name=$('openName').value.trim(),mins=Number($('openN').value)*Number($('openUnit').value);
  run('resOpen','Open role',name,'open',{name,closeMinutes:mins},d=>`Requested ${nice(d.roleKey)}; it shows in the table in a few seconds.`,d=>{pending.push({key:d.roleKey,since:Date.now()});$('openName').value='';});
});
$('send').addEventListener('submit',e=>{e.preventDefault();
  const key=$('sendRole').value,lane=$('sendLane').value,n=Number($('sendCount').value),work=Number($('sendWork').value),r=lastRoles.find(x=>x.roleKey===key);
  run('resSend','Send events',`${nice(key)}, lane ${lane}`,'publish',{roleKey:key,lane,count:n,workMillis:work},()=>`Sent ${plural(n,'event')} to lane ${lane} of ${nice(key)}.`);
});
$('cancel').addEventListener('submit',e=>{e.preventDefault();
  const r=lastRoles.find(x=>x.key===$('cancelRole').value);if(!r)return;
  const t=sum(r),c=$('resCancel');c.className='res confirm';c.replaceChildren(
    el('span',{},`Cancel ${nameOf(r)}? ${t.a?plural(t.a,'running child instance')+' will be cancelled too.':'No child instance is running.'} ${bySchedule(r)?'This role was opened by the schedule, so the schedule is switched off too and it does not open again. Switch it on again under Schedule.':''} `),
    (()=>{const y=el('button',{type:'button',class:'stop'},'Cancel role');y.onclick=()=>{own.add(r.key);run('resCancel','Cancel role',nameOf(r),'cancel',{key:r.key},d=>`${nice(d.roleKey)} cancel accepted; the table shows it as cancelled in a few seconds.${d.scheduleOff?' The schedule is now off.':''}`,d=>{cancelling.set(r.key,Date.now());if(d.scheduleOff)loaded=false;renderRoles();});};return y;})(),
    (()=>{const n=el('button',{type:'button'},'Keep');n.onclick=()=>result('resCancel','','');return n;})());
});
$('schedule').addEventListener('submit',e=>{e.preventDefault();
  const on=$('enabled').value==='on';
  result('resSchedule','working','Working...');
  api('schedule',{enabled:on,start:startRule(),close:closeRule()}).then(()=>{const t=on?'Saved. '+describe():'Saved. Schedule off; open roles keep running.';$('resSchedule').className='res done';$('resSchedule').replaceChildren(el('button',{class:'go',type:'submit',id:'save'},'Save schedule'),' '+t);log('Save schedule','schedule',t);refresh();})
  .catch(err=>{$('resSchedule').className='res failed';$('resSchedule').replaceChildren(el('button',{class:'go',type:'submit',id:'save'},'Save schedule'),' '+err.message);log('Save schedule','schedule',err.message,true);});
});
$('connect').onclick=()=>{loaded=false;refresh();};
log('Page loaded','','');renderForms();loop();setInterval(renderRoles,1000);
</script>
</body>
</html>
